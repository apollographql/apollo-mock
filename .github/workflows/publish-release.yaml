on:
  push:
    tags:
      - '*'

jobs:
  publish-maven-central:
    runs-on: ubuntu-latest
    if: github.event.repository.fork == false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - run: |
          LIBRARIAN_RELEASE=true ./gradlew librarianPublishToMavenCentral
        env:
          LIBRARIAN_SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          LIBRARIAN_SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          LIBRARIAN_SIGNING_PRIVATE_KEY: ${{ secrets.SONATYPE_GPG_KEY }}
          LIBRARIAN_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.SONATYPE_GPG_KEY_PASSWORD }}

  build-binaries:
    runs-on: macos-latest
    if: github.event.repository.fork == false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - run: ./gradlew :cli:linkReleaseExecutableLinuxX64 :cli:linkReleaseExecutableMacosArm64 :cli:jvmDistZip
      - run: |
          mkdir -p release-assets
          cp cli/build/bin/linuxX64/releaseExecutable/apollo-mock.kexe release-assets/apollo-mock-linux-x64
          cp cli/build/bin/macosArm64/releaseExecutable/apollo-mock.kexe release-assets/apollo-mock-macos-arm64
          cp cli/build/distributions/*-jvm.zip release-assets/apollo-mock-jvm.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: binaries
          path: release-assets/*

  publish-github-release:
    needs: [build-binaries]
    runs-on: ubuntu-latest
    if: github.event.repository.fork == false
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          path: release-assets
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" release-assets/* --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
