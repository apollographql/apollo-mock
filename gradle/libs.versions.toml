[versions]
kotlin = "2.4.10"
ktor = "3.5.1"
apollo = "5.1.1-SNAPSHOT"
apollo-execution = "0.1.3-SNAPSHOT-d346e2240d076db0d1f973846dcb7f6e559879e3"
kotlinx-serialization = "1.11.0"
kotlinx-coroutines = "1.11.0"
kotlinx-io = "0.9.1"
logback = "1.5.18"
clikt = "5.1.0"
gratatouille = "0.2.3"
ksp = "2.3.9"

[libraries]
clikt = { module = "com.github.ajalt.clikt:clikt", version.ref = "clikt" }
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinx-io" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
apollo-ast = { module = "com.apollographql.apollo:apollo-ast", version.ref = "apollo" }
apollo-runtime = { module = "com.apollographql.apollo:apollo-runtime", version.ref = "apollo" }
apollo-execution = { module = "com.apollographql.apollo:apollo-execution", version.ref = "apollo" }
apollo-execution-runtime = { module = "com.apollographql.execution:apollo-execution-runtime", version.ref = "apollo-execution" }
apollo-execution-ktor = { module = "com.apollographql.execution:apollo-execution-ktor", version.ref = "apollo-execution" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-curl = { module = "io.ktor:ktor-client-curl", version.ref = "ktor" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

[plugins]
apollo = { id = "com.apollographql.apollo", version.ref = "apollo" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
tapmoc = { id = "com.gradleup.tapmoc", version = "0.4.2"}
gradleup-librarian = { id = "com.gradleup.librarian", version = "0.2.2-SNAPSHOT-56c6c6f5ae3750f8388eac59e2f7c7e88bf68cea" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
gratatouille = { id = "com.gradleup.gratatouille", version.ref = "gratatouille" }
gratatouille-tasks = { id = "com.gradleup.gratatouille.tasks", version.ref = "gratatouille" }